[project]
name = "ingest"
version = "0.1.0"
description = "RAG ingestion pipeline for the agentic harness (Obsidian vault + claude-mem history -> Postgres/pgvector)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastembed>=0.7.0",
    "psycopg[binary]>=3.2.0",
    "python-frontmatter>=1.1.0",
    "PyYAML>=6.0.1",
]

[project.scripts]
ingest = "ingest.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
